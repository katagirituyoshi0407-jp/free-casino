<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Casino</title>
</head>

<body>

  <h1>Free Casino</h1>

  <!-- 登録 -->
  <section>
    <h2>新規登録</h2>

    <input id="signupUsername" type="text" placeholder="ユーザー名">
    <input id="signupEmail" type="email" placeholder="メールアドレス">
    <input id="signupPassword" type="password" placeholder="パスワード">

    <button id="signupButton">登録</button>
  </section>

  <hr>

  <!-- ログイン -->
  <section>
    <h2>ログイン</h2>

    <input id="loginEmail" type="email" placeholder="メールアドレス">
    <input id="loginPassword" type="password" placeholder="パスワード">

    <button id="loginButton">ログイン</button>
  </section>

  <hr>

  <!-- ログイン後 -->
  <section id="account" style="display: none;">
    <h2>アカウント</h2>

    <p>ユーザー名：<span id="username"></span></p>
    <p>💰 コイン：<span id="coins"></span></p>

    <button id="logoutButton">ログアウト</button>
  </section>

  <p id="message"></p>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://nambmvqtpktwhwcethbi.supabase.co";
    const SUPABASE_KEY = "sb_publishable_YNmyLuQv9f8Kk5v5GVNPdA_Cyd_1432";

    const { createClient } = supabase;

    const client = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // メッセージ表示
    function showMessage(message) {
      document.getElementById("message").textContent = message;
    }


    // =========================
    // 新規登録
    // =========================

    document.getElementById("signupButton").addEventListener("click", async () => {

      const username =
        document.getElementById("signupUsername").value.trim();

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      if (!username || !email || !password) {
        showMessage("すべて入力してください");
        return;
      }

      const { data, error } = await client.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            username: username
          }
        }
      });

      if (error) {
        showMessage("登録エラー：" + error.message);
        return;
      }

      showMessage("登録しました！");

      console.log(data);
    });


    // =========================
    // ログイン
    // =========================

    document.getElementById("loginButton").addEventListener("click", async () => {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      if (!email || !password) {
        showMessage("メールアドレスとパスワードを入力してください");
        return;
      }

      const { data, error } =
        await client.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        showMessage("ログインエラー：" + error.message);
        return;
      }

      showMessage("ログインしました！");

      await loadProfile();
    });


    // =========================
    // プロフィール取得
    // =========================

    async function loadProfile() {

      const {
        data: { user }
      } = await client.auth.getUser();

      if (!user) {
        return;
      }

      const { data: profile, error } =
        await client
          .from("profiles")
          .select("username, coins")
          .eq("id", user.id)
          .single();

      if (error) {
        showMessage("プロフィール取得エラー：" + error.message);
        console.error(error);
        return;
      }

      document.getElementById("username").textContent =
        profile.username || "未設定";

      document.getElementById("coins").textContent =
        Number(profile.coins).toLocaleString();

      document.getElementById("account").style.display = "block";
    }


    // =========================
    // ログアウト
    // =========================

    document.getElementById("logoutButton").addEventListener("click", async () => {

      const { error } = await client.auth.signOut();

      if (error) {
        showMessage("ログアウトエラー：" + error.message);
        return;
      }

      document.getElementById("account").style.display = "none";

      showMessage("ログアウトしました");
    });


    // =========================
    // ページを開いたとき
    // =========================

    async function checkLogin() {

      const {
        data: { session }
      } = await client.auth.getSession();

      if (session) {
        await loadProfile();
      }
    }

    checkLogin();

  </script>

</body>
</html>
