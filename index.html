<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Free Casino</title>
</head>
<body>

    <h1>🎰 FREE CASINO</h1>

    <p>所持コイン： <span id="coin-count">10000</span> 枚</p>

    <h2>🎰 スロット</h2>
    <p>ベット 100</p>
    <button>回す</button>
    <p>🍒 🍋 🔔</p>

    <h2>🃏 ブラックジャック</h2>
    <p>あなた：**-**（ 0）</p>
    <p>ディーラー：**-**（ 0）</p>
    <p>100</p>
    <button>開始</button>
    <button disabled>ヒット</button>
    <button disabled>スタンド</button>

    <h2>🎡 ルーレット</h2>
    <p>100</p>
    <button>赤</button>
    <button>黒</button>
    <button>0</button>
    <p>?</p>

    <h2>🔢 Keno</h2>
    <p>1〜20から5個選んでください。</p>
    <p>100</p>
    <button>抽選</button>

    <h2>💣 Mines</h2>
    <p>爆弾を避けて開け続けるほど倍率アップ。10マス・3爆弾。</p>
    <p>100</p>
    <button>開始</button>
    <button disabled>換金</button>

    <h2>🎲 ダイス</h2>
    <p>100</p>
    <button>4〜6</button>
    <button>1〜3</button>
    <p>?</p>

    <!-- 💼 追加したジョブ機能（元のプレーンなテキストUIに準拠） -->
    <h2>💼 ジョブ</h2>
    <div id="job-status">💤 現在は働いていません</div>
    <button class="job-btn" onclick="startWork('🪰 蝿叩き', 10, 3)">🪰 蝿叩き (3秒/10枚)</button>
    <button class="job-btn" onclick="startWork('📦 倉庫整理', 100, 10)">📦 倉庫整理 (10秒/100枚)</button>
    <button class="job-btn" onclick="startWork('💻 プログラミング', 500, 30)">💻 プログラミング (30秒/500枚)</button>

    <h2>📜 履歴</h2>
    <ul id="history-list">
        <li>まだありません。</li>
    </ul>

    <!-- ⚙️ JavaScript ロジック -->
    <script>
        // 所持コインのグローバル変数
        let coins = 10000;
        let isWorking = false; // 労働中の重複防止フラグ

        // 画面のコイン表示を更新する関数
        function updateCoinDisplay() {
            document.getElementById('coin-count').innerText = coins;
        }

        // ジョブの作動ロジック
        function startWork(jobName, reward, duration) {
            // すでに働いている場合は何もしない
            if (isWorking) return;

            isWorking = true;
            let timeLeft = duration;

            // 連打防止のため、一時的にすべてのジョブボタンを無効化
            const buttons = document.querySelectorAll('.job-btn');
            buttons.forEach(btn => btn.disabled = true);

            // ステータス更新
            const statusDiv = document.getElementById('job-status');
            statusDiv.innerText = `⏱️ ${jobName}中... あと ${timeLeft} 秒`;

            // カウントダウンタイマー
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    statusDiv.innerText = `⏱️ ${jobName}中... あと ${timeLeft} 秒`;
                } else {
                    clearInterval(timer); // タイマー終了
                    
                    // コインを増やして表示を更新
                    coins += reward;
                    updateCoinDisplay();

                    // 履歴に追加
                    addHistory(`💼 ジョブ: 【${jobName}】を完了して ${reward} 枚獲得`);

                    // 状態を初期化
                    statusDiv.innerText = `💤 現在は働いていません`;
                    isWorking = false;
                    buttons.forEach(btn => btn.disabled = false);

                    // 完了アラート
                    alert(`${jobName} が完了しました！ ${reward} 枚のコインを稼ぎました。`);
                }
            }, 1000);
        }

        // 履歴追加用の簡易関数
        function addHistory(text) {
            const historyList = document.getElementById('history-list');
            
            // 初回追加時に「まだありません。」の文字を消す
            if (historyList.children.length === 1 && historyList.children[0].innerText === "まだありません。") {
                historyList.innerHTML = "";
            }

            const li = document.createElement('li');
            li.innerText = text;
            // 新しい履歴を一番上（先頭）に挿入
            historyList.insertBefore(li, historyList.firstChild);
        }
    </script>
</body>
</html>
