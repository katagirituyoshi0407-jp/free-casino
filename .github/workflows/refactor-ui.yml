name: Refactor UI

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/refactor-ui.yml'
      - 'ui-refactor.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[ui-refactor]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Split CSS/JS and translate UI
        shell: python
        run: |
          from pathlib import Path
          import re
          import shutil

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          if '<!-- UI-REFACTORED -->' in html:
              print('Already refactored; nothing to do.')
              raise SystemExit(0)

          shutil.copyfile(p, 'index.before-refactor.html')

          style = re.search(r'<style>(.*?)</style>', html, re.S | re.I)
          if style:
              Path('css').mkdir(exist_ok=True)
              Path('css/style.css').write_text(style.group(1).strip() + '\n', encoding='utf-8')
              html = html[:style.start()] + '<link rel="stylesheet" href="css/style.css">' + html[style.end():]

          scripts = list(re.finditer(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', html, re.S | re.I))
          if scripts:
              js = '\n\n'.join(m.group(1).strip() for m in scripts)
              Path('js').mkdir(exist_ok=True)
              Path('js/app.js').write_text(js + '\n', encoding='utf-8')
              for m in reversed(scripts):
                  html = html[:m.start()] + '<script src="js/app.js"></script>' + html[m.end():]

          replacements = {
              '>LOGIN<': '>ログイン<', '>REGISTER<': '>新規登録<',
              '>WELCOME BACK<': '>おかえりなさい<', '>CREATE ACCOUNT<': '>アカウント作成<',
              '>ENTER SYSTEM<': '>ログインする<', '>INITIALIZE ACCOUNT<': '>アカウントを作成<',
              '>CURRENT USER<': '>現在のユーザー<', '> COINS<': '> コイン<',
              '>SLOT<': '>スロット<', '>BLACKJACK<': '>ブラックジャック<',
              '>MINES<': '>マインズ<', '>WORK<': '>仕事<', '>SEND<': '>送金<',
              '>SEND COINS<': '>コイン送金<', '>BANK<': '>銀行<',
              '>BET AMOUNT<': '>ベット額<', '>SPIN<': '>回す<', '>DEAL<': '>配る<',
              '>HIT<': '>ヒット<', '>STAND<': '>スタンド<', '>DOUBLE<': '>ダブル<',
              '>DRAW<': '>抽選<', '>START<': '>開始<', '>CASH OUT<': '>換金<',
              '>READY<': '>準備完了<', '>SELECT NUMBERS<': '>数字を選択してください<',
              '>START GAME<': '>ゲームを開始してください<', '>SELECT A JOB<': '>仕事を選択してください<',
              '>TRANSFER HISTORY<': '>送金履歴<', '>BANK BALANCE<': '>銀行残高<',
              '>CREDIT SCORE<': '>信用スコア<', '>DEPOSIT<': '>預け入れ<', '>WITHDRAW<': '>引き出し<',
              '>BANK TRANSFER<': '>銀行送金<', '>TRANSFER<': '>送金する<',
              '>FIXED DEPOSIT<': '>定期預金<', '>TAKE LOAN<': '>借りる<',
              '>REPAY ACTIVE LOAN<': '>ローンを返済<', '>BANK HISTORY<': '>銀行履歴<',
              '>REWARD +50 COINS<': '>報酬 +50 コイン<', '>REWARD +75 COINS<': '>報酬 +75 コイン<',
              '>CLICK! ': '>連打！ ', '>SUBMIT // +75<': '>送信 // +75<',
              '>ANSWER<': '>回答する<', '>LOAN AMOUNT<': '>借入額<', '>AMOUNT<': '>金額<',
              '>RECIPIENT<': '>送信先<', '>RECIPIENT USERNAME<': '>送信先ユーザー名<',
              '>NOTE<': '>メモ<',
          }
          for a, b in replacements.items(): html = html.replace(a, b)

          for a, b in {
              'placeholder="EMAIL"':'placeholder="メールアドレス"',
              'placeholder="PASSWORD"':'placeholder="パスワード"',
              'placeholder="USERNAME"':'placeholder="ユーザー名"',
              'placeholder="CODE"':'placeholder="コードを入力"',
          }.items(): html = html.replace(a, b)

          html = html.replace('<title>FREE CASINO</title>', '<title>FREE CASINO｜無料カジノゲーム</title>')
          html = html.replace('<html lang="ja">', '<!-- UI-REFACTORED -->\n<html lang="ja">')
          p.write_text(html, encoding='utf-8')

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index.before-refactor.html css/style.css js/app.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: split frontend and Japanese-first labels [ui-refactor]"
          git push
