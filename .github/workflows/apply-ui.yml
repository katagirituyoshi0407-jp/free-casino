name: Apply UI stylesheet

on:
  push:
    paths:
      - 'ui.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-blackjack
          fetch-depth: 0
      - name: Add UI stylesheet link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<link rel="stylesheet" href="ui.css">'
          if tag not in s:
              s = s.replace('</head>', f'{tag}\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply enhanced casino UI'
          git push origin HEAD:feature/complete-blackjack
